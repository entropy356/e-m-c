name: Scratch branch cleanup

on:
  push:
    branches:
      - 'scratch/**'
    paths:
      - '.scratch/DONE'

permissions:
  contents: write

concurrency:
  group: scratch-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remove-completed:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed scratch branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          case "$branch" in
            scratch/*) ;;
            *) echo "Refusing to delete non-scratch branch"; exit 1 ;;
          esac

          # Confirm the event still points at the current branch head.
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Branch moved since DONE was pushed; skipping deletion"
            exit 0
          fi

          # Require both metadata and explicit completion marker at this exact commit.
          if ! gh api -X GET "repos/${GITHUB_REPOSITORY}/contents/TASK.md" -f ref="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Missing TASK.md; skipping deletion"
            exit 0
          fi
          if ! gh api -X GET "repos/${GITHUB_REPOSITORY}/contents/.scratch/DONE" -f ref="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Missing .scratch/DONE; skipping deletion"
            exit 0
          fi

          echo "Deleting completed branch: $branch"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
